services:
  app:
    build: .
    container_name: hk-job-analyzer
    ports:
      - "80:80"
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config:/app/config
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
